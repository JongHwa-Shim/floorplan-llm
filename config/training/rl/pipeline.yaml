# RL(강화학습) 훈련 파이프라인 설정
# GDPO(보상별 독립 정규화) + 토큰 수준 신용할당 + Rule-based RLVR
# Mod Record: 이전 구조에서는 sft/final/model.safetensors(merged full model)를 로컬에서 로드했음.
# 새 구조: HF Hub NF4 base + partial_state.pt + SFT adapter(frozen) + RL adapter(trainable)로 구성.

model:
  user: "Qwen"
  name: "Qwen2.5-Coder-7B"
  hub_id: "${model.user}/${model.name}"                                              # HF Hub 전체 경로
  embed_align_dir: "data/models/Qwen2.5-Coder-7B/final_checkpoints/embed_align"             # partial_state.pt 위치
  sft_adapter_dir: "data/models/Qwen2.5-Coder-7B/final_checkpoints/sft/10epoch additional training using sft-lora-0424-first-begin(20epoch)/checkpoint-105399"                 # SFT adapter 위치 (frozen)
  tokenizer_dir: "data/models/${model.name}/tokenization"                            # 확장 토크나이저 경로
  vocab_extension: "${model.tokenizer_dir}/vocab_extension.json"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: false

# LoRA(Low-Rank Adaptation) 설정 (RL adapter)
# Mod Record: DoRA → 표준 LoRA 전환 (DoRA unmerged inference O(d²) 병목 제거)
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Qwen2.5 attention + MLP 전 레이어 대상
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

data:
  arrow_dir: "data/dataset/processed_dataset/rplan/arrow"
  # 프롬프트 생성용 증강 (입력 조건만 증강, 출력은 모델이 생성)
  aug_pipeline_config: "config/training/augmentation/sft.yaml"
  max_prompt_length: 2048
  # 전체 데이터 기준: mean=167, p99=232, max=328 (도어 포함)
  # 512면 max 대비 1.5× 여유, 2048 대비 4× 속도 개선
  max_completion_length: 512

distributed:
  # 사용할 GPU 수. 1이면 단일 GPU 모드, 2 이상이면 torchrun DDP로 자동 전환
  nproc_per_node: 1

resume:
  enabled: false
  checkpoint_path: null
  auto_find_latest: true

training:
  output_dir: "data/models/${model.name}/checkpoints/rl"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 100
  report_to: "wandb"
  project_name: "floorplan-llm"
  run_name: "floorplan-rl"
  seed: 42
  # 체크포인트 최대 보존 수 (null = 제한 없이 전체 보존)
  save_total_limit: null
  # optimizer: paged_adamw_32bit는 momentum/variance를 CPU RAM으로 페이징해 GPU OOM 방지
  optim: "paged_adamw_32bit"
  max_steps: 0                          # 0 = 전체 epoch 기반

# RL 생성 설정 (vLLM 포함)
rl:
  num_generations: 4                    # 프롬프트당 생성 개수 (G)
  temperature: 0.7
  top_p: 0.95
  kl_coeff: 0.05                        # KL 페널티 계수 (beta)
  clip_range: 0.2                       # PPO 클리핑 엡실론
  num_iterations: 2                     # roll-out 재활용 횟수

  # vLLM 설정 (기본 비활성화 — 아래 Mod Record 참고)
  # Mod Record: NF4 base + LoRA 환경에서 vLLM colocate가 수치적으로 발산함을 확인.
  # PEFT의 NF4 LoRA merge는 sync 시 dequant→add→re-quantize 라운드 트립을 수행하는데,
  # 4bit 재양자화 손실(peft/tuners/lora/bnb.py:397에서 "rounding errors" 경고)이 매 step
  # 누적되어 vLLM 정책과 훈련 정책 간 토큰 logprob 차이가 폭증한다. 결과: importance
  # sampling ratio 붕괴(~e-26) + K3 KL 추정자 폭주(1e+26+) → loss 발산 + grad NaN.
  # 따라서 NF4 환경에서는 HF generate가 안정적이며 200~300 토큰 시퀀스에서 더 빠름.
  # vLLM은 bf16 base + 긴 시퀀스(≥1024) + 멀티 GPU 환경에서만 의미 있음.
  use_vllm: false
  vllm_mode: "colocate"                 # "colocate" 또는 "server" (3 GPU 이상 환경)
  vllm_gpu_memory_utilization: 0.45    # RTX 3090 24GB 기준. OOM 시 0.4로 낮춤
  vllm_enable_sleep_mode: false        # CPU 오프로드 없음 → rollout↔훈련 전환 지연 없음
  vllm_tensor_parallel_size: 1         # 각 DDP rank가 자기 GPU 1개 단독 사용
  vllm_max_model_len: 4096
  # server 모드 전환 시 사용 (3 GPU 이상 환경에서만)
  vllm_server_host: "0.0.0.0"
  vllm_server_port: 8000
  vllm_server_timeout: 300.0

# 보상함수 설정
# weight: 보상 가중합 계수 (GDPO 정규화 후 적용)
# credit_assignment: true면 토큰별 차등 어드밴티지 적용
# 옵션 F (Sign-Asymmetric Credit Assignment) 파라미터:
#   nominal_gain (alpha):      정상 토큰 신용 이득 계수, [0, 1)
#   faulty_attenuation (beta): 오류 토큰 신용 감쇄 계수, [0, 1)
#                              (A>0 magnitude 감쇄, A<0 magnitude 증폭)
#   penalty_offset (kappa):    advantage 무관 절대 페널티 오프셋, [0, inf)
# 수식: a_t = A * [1 + sign(A) * (alpha*(1-m) - beta*m)] - kappa * m
rewards:
  format:
    enabled: true
    weight: 1.0
    hard_gate: true                     # R_format=0이면 모든 보상=0
    credit_assignment: true
    nominal_gain: 0.3
    faulty_attenuation: 0.7
    penalty_offset: 1.5

  count_total:
    enabled: true
    weight: 0.5
    credit_assignment: false

  count_type:
    enabled: true
    weight: 1.0
    credit_assignment: false

  orthogonality:
    enabled: true
    weight: 1.5
    credit_assignment: true
    nominal_gain: 0.2
    faulty_attenuation: 0.5
    penalty_offset: 1.0

  no_overlap:
    enabled: true
    weight: 2.0
    credit_assignment: true
    nominal_gain: 0.3
    faulty_attenuation: 0.6
    penalty_offset: 1.5

  room_in_outline:
    enabled: true
    weight: 1.5
    credit_assignment: true
    nominal_gain: 0.2
    faulty_attenuation: 0.5
    penalty_offset: 1.0

  # outline 꼭짓점이 방 내부에 포함되는지 (room_in_outline 케이스 B 검출)
  # 방 꼭짓점은 모두 outline 안에 있으나 방 edge가 outline 오목부를 가로지를 때 발생
  outline_in_room:
    enabled: true
    weight: 1.0
    credit_assignment: true
    nominal_gain: 0.2
    faulty_attenuation: 0.5
    penalty_offset: 1.0

  # outline 내 빈공간 비율 보수값 (room_in_outline의 쌍대)
  # 신용할당 OFF: 빈공간 책임 소재 모호 + 입력 좌표 노이즈로 토큰 단위 시그널 부정확
  coverage:
    enabled: true
    weight: 1.5
    credit_assignment: false

  connectivity:
    enabled: true
    weight: 1.0
    credit_assignment: false

  spatial:
    enabled: true
    weight: 0.5
    credit_assignment: false

  # 입력 프롬프트의 좌표 명시 방(앵커+drop_type)이 출력에 일관되게 포함되는지 검증
  # threshold: 무게중심 거리 임계값(px). 노이즈 3σ=9px + 모델 오차 마진. transform 증강은
  # 입력/출력 좌표에 동일 적용되므로 상대 오차 없음.
  input_consistency:
    enabled: true
    weight: 1.5
    credit_assignment: false
    threshold: 15.0

# GDPO + 토큰 신용할당 어드밴티지 계산 설정
advantage:
  eps: 1.0e-8                           # 수치 안정성 엡실론
  use_token_credit_assignment: true     # false로 설정 시 전체 신용할당 비활성화 (균등 broadcast)
